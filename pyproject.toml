[project]
name = "enet100-bridge"
version = "0.1.0"
description = "VXI-11 server that makes NI GPIB-ENET/100 boxes usable from modern VISA libraries"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []
keywords = ["gpib", "vxi-11", "visa", "national instruments", "gpib-enet", "test equipment"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]

[project.scripts]
enet100-bridge = "enet100_bridge.__main__:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enet100_bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
