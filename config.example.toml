# enet100-bridge configuration.
#
# Windows: C:\ProgramData\enet100-bridge\config.toml
# Linux:   /etc/enet100-bridge/config.toml
# or pass --config / set ENET100_BRIDGE_CONFIG.

[bridge]
listen = "0.0.0.0"        # address the VXI-11 server listens on
core_port = 9010          # VXI-11 core channel (clients find it via the portmapper)
abort_port = 9011         # VXI-11 abort channel
# Port 111 portmapper:
#   "auto"    serve it ourselves, or register with rpcbind if it already owns 111
#   "builtin" always serve it ourselves (fail if 111 is taken)
#   "rpcbind" always register with the system rpcbind (Linux)
#   "off"     don't; clients must be configured with core_port directly
portmapper = "auto"
admin_port = 9012         # localhost-only status/stop port; 0 disables it
max_recv_size = 4096      # largest write chunk clients may send in one call
log_level = "INFO"
log_file = ""             # e.g. "C:/ProgramData/enet100-bridge/bridge.log"
# Advertise the bridge over mDNS as a VXI-11 device (_vxi-11._tcp), as LXI
# instruments do. Windows: through the system's mDNS service. Linux: Avahi.
mdns = true
mdns_name = ""            # default "enet100-bridge on <host name>"

# One [[box]] per GPIB-ENET/100. `name` is the interface name clients use:
#   TCPIP::<bridge host>::gpib0,4::INSTR    -> instrument at primary address 4
#   TCPIP::<bridge host>::gpib0,4,2::INSTR  -> secondary address 2
#   TCPIP::<bridge host>::gpib0::INTFC      -> the bus itself (IFC, REN, ATN commands)
[[box]]
name = "gpib0"
host = "192.168.1.50"     # the box's IP or DNS name; `enet100-bridge discover` finds it

# The box ignores everything for ~45-60 s after power-on, and talking to it too
# early wedges it. Once it has been seen missing (by discovery), the bridge
# waits this long after it reappears before connecting.
boot_settle_s = 60
connect_on_start = true   # open the board session at startup, not on first use
use_discovery = true      # check the box with a UDP discovery query before connecting
retry_interval_s = 15

# Set eos_8bit = true to compare the read termination character on all 8 bits.
# Off by default: with it on, the box dropped the trailing LF in a VISA capture.
eos_8bit = false

# GPIB settings, as on NI MAX's GPIB settings page. The bridge sends them to the
# box every time it opens its session (each new session starts from the box's
# own defaults, e.g. REN off). These are NI-488.2's defaults.
gpib_address = 0          # the box's own primary address, 0-30
gpib_secondary = -1       # its secondary address, 0-30, or -1 for none
system_controller = true
assert_ren = true         # assert REN when system controller
autopoll = true           # automatic serial polling (SRQ events need it)
cic_protocol = false
bus_timing_ns = 500       # T1 delay: 2000, 500 or 350
hs488_cable_m = 0         # HS488 cable length in metres; 0 = HS488 off
board_timeout_s = 10      # timeout for bus-level operations
ifc_on_connect = false    # pulse IFC after connecting

# Optional: a shell command that power-cycles the box. The bridge runs it when
# the box accepts connections but stops answering (wedged), at most once per
# recovery_cooldown_s. Example for a Home Assistant smart plug:
#   recovery_command = 'curl -s -X POST -H "Authorization: Bearer TOKEN" -H "Content-Type: application/json" -d "{\"entity_id\":\"switch.enet100\"}" http://homeassistant.local:8123/api/services/switch/turn_off && sleep 10 && curl -s -X POST -H "Authorization: Bearer TOKEN" -H "Content-Type: application/json" -d "{\"entity_id\":\"switch.enet100\"}" http://homeassistant.local:8123/api/services/switch/turn_on'
recovery_command = ""
recovery_cooldown_s = 300

# Optional extra device names, e.g. so a client can open TCPIP::host::dmm::INSTR
[aliases]
# dmm = "gpib0,4"
